name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests (macOS, ${{ matrix.traits.name }})
    runs-on: macos-15
    strategy:
      matrix:
        traits:
          - { name: "DependencyInjection (default)", flags: "" }
          - { name: "without DependencyInjection", flags: "--disable-default-traits" }
    steps:
      - uses: actions/checkout@v4
      - name: Check DeallocTestsCore rules
        # Core is shared with DeallocWatcher, which apps link: no test frameworks, no classes or actors
        run: |
          ! grep -rnE "^\s*(@testable )?import (XCTest|Testing)\b" Sources/DeallocTestsCore
          ! grep -rnE "^\s*(public |package |internal |private |fileprivate |final |open )*(class|actor) [A-Z]" Sources/DeallocTestsCore
      - name: Run tests
        run: swift test ${{ matrix.traits.flags }}

  package-ios:
    name: Package tests (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          # Use whichever iPhone simulator the runner's Xcode provides
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $UDID"
          xcodebuild test \
            -scheme DeallocTests \
            -destination "id=$UDID"

  sample-apps:
    name: Sample apps (iOS)
    # Package traits in an Xcode project need Xcode 26.4 or later
    runs-on: macos-26
    strategy:
      matrix:
        sample: [DeallocTestsAppSPM, DeallocTestsAppDIFreeSPM]
    steps:
      - uses: actions/checkout@v4
      # The samples contain an intentional leak, so their tests are expected to fail.
      # CI only verifies that they compile.
      - name: Build for testing
        working-directory: SampleApps/${{ matrix.sample }}
        run: |
          xcodebuild build-for-testing \
            -scheme DeallocTestsAppSPM \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
