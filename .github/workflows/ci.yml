name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests (macOS, ${{ matrix.traits.name }})
    runs-on: macos-15
    strategy:
      matrix:
        traits:
          - { name: "DependencyInjection (default)", flags: "" }
          - { name: "without DependencyInjection", flags: "--disable-default-traits" }
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test ${{ matrix.traits.flags }}

  package-latest-xcode:
    name: Package tests (macOS, latest Xcode)
    # Warning severity uses Issue.record(severity:) from Swift 6.3; macos-15 only builds the fallback
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Run tests
        run: swift test

  package-ios:
    name: Package tests (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          # Use whichever iPhone simulator the runner's Xcode provides
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $UDID"
          xcodebuild test \
            -scheme DeallocTests \
            -destination "id=$UDID"
